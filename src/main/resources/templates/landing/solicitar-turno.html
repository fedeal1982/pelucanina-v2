<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno - Servicio Integral para Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 16px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin-left: auto; margin-right: auto; margin-bottom: 30px; }
        .navbar-brand-text { font-size: 18px; font-weight: 800; color: white; text-decoration: none; }
        .btn-back { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; font-weight: 600; }
        .btn-back:hover { color: white; }
        .form-card { background: white; border-radius: 24px; padding: 40px; max-width: 700px; margin: 0 auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .form-title { font-size: 28px; font-weight: 800; color: #333; margin-bottom: 8px; }
        .form-subtitle { color: #888; margin-bottom: 30px; font-size: 15px; }
        .form-label { font-weight: 600; color: #444; font-size: 14px; }
        .form-control, .form-select { border: 2px solid #eee; border-radius: 10px; padding: 12px; font-size: 15px; transition: all 0.2s; }
        .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .btn-submit { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; width: 100%; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.3); color: white; }
        .servicio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 5px; }
        .servicio-option { border: 2px solid #eee; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 13px; font-weight: 600; color: #555; }
        .servicio-option:hover { border-color: #667eea; color: #667eea; background: #f0f4ff; }
        .servicio-option input { display: none; }
        .servicio-option.selected { border-color: #667eea; background: #f0f4ff; color: #667eea; }
        .servicio-icon { font-size: 24px; display: block; margin-bottom: 5px; }
        .divider { border: none; border-top: 2px solid #f0f0f0; margin: 25px 0; }
    </style>
</head>
<body>

    <div style="max-width:700px; margin:0 auto 20px;">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/inicio" class="btn-back">← Volver al inicio</a>
            <a href="/login" style="color:rgba(255,255,255,0.8); text-decoration:none; font-size:14px; font-weight:600;">Acceso Staff</a>
        </div>
    </div>

    <div class="form-card">
        <h1 class="form-title">📅 Solicitar Turno</h1>
        <p class="form-subtitle">Completá el formulario y nos pondremos en contacto para confirmar tu turno.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/solicitar-turno}" method="post">

            <div class="mb-4">
                <label class="form-label mb-3">Tipo de servicio *</label>
                <div class="servicio-grid">
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Consulta médica" required>
                        <span class="servicio-icon">🏥</span> Consulta Médica
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Vacunación">
                        <span class="servicio-icon">💉</span> Vacunación
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Desparasitación">
                        <span class="servicio-icon">💊</span> Desparasitación
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Baño">
                        <span class="servicio-icon">🛁</span> Baño
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Corte">
                        <span class="servicio-icon">✂️</span> Corte
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Baño y corte">
                        <span class="servicio-icon">🐕</span> Baño y Corte
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Corte de uñas">
                        <span class="servicio-icon">🦷</span> Corte de Uñas
                    </label>
                    <label class="servicio-option">
                        <input type="radio" name="servicio" value="Otro">
                        <span class="servicio-icon">➕</span> Otro
                    </label>
                </div>
            </div>

            <hr class="divider">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Tu nombre completo *</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nombre de tu mascota</label>
                    <input type="text" name="mascota" class="form-control" placeholder="Ej: Max">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel" name="telefono" class="form-control" placeholder="Ej: 3512345678" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha preferida *</label>
                <input type="date" name="fecha" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Mensaje adicional</label>
                <textarea name="mensaje" class="form-control" rows="3" placeholder="Contanos algo más sobre tu mascota o el motivo de la consulta..."></textarea>
            </div>

            <button type="submit" class="btn-submit">✅ Enviar Solicitud de Turno</button>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Marcar visualmente el servicio seleccionado
    document.querySelectorAll('.servicio-option input').forEach(radio => {
        radio.addEventListener('change', () => {
            document.querySelectorAll('.servicio-option').forEach(opt => opt.classList.remove('selected'));
            radio.parentElement.classList.add('selected');
        });
    });

    // Fecha mínima = hoy
    const fechaInput = document.querySelector('input[name="fecha"]');
    const hoy = new Date().toISOString().split('T')[0];
    fechaInput.setAttribute('min', hoy);
</script>
</body>
</html>
