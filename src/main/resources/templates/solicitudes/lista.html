<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px 0; }
        .main-card { border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .table thead { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .table thead th { border: none; }
        .btn-grad { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
        .back-link { color: #667eea; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="container py-3">
<div class="card main-card p-4">

    <a href="/admin" class="back-link mb-3 d-inline-block">← Volver al inicio</a>
    <h1 class="h3 fw-bold mb-4" style="color:#667eea;">🌐 Solicitudes de Turno Web</h1>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

    <div th:if="${!solicitudes.isEmpty()}" class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th class="d-none d-md-table-cell">Teléfono</th>
                    <th class="d-none d-md-table-cell">Mascota</th>
                    <th>Servicio</th>
                    <th class="d-none d-lg-table-cell">Fecha Preferida</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${solicitudes}">
                    <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="fw-semibold" th:text="${s.nombre}"></td>
                    <td th:text="${s.email}"></td>
                    <td class="d-none d-md-table-cell" th:text="${s.telefono}"></td>
                    <td class="d-none d-md-table-cell" th:text="${s.mascota ?: '-'}"></td>
                    <td th:text="${s.servicio}"></td>
                    <td class="d-none d-lg-table-cell" th:text="${#temporals.format(s.fechaPreferida, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:if="${s.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">⏳ Pendiente</span>
                        <span th:if="${s.estado == 'CONFIRMADO'}" class="badge bg-success">✅ Confirmado</span>
                        <span th:if="${s.estado == 'CANCELADO'}" class="badge bg-danger">❌ Cancelado</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1 flex-wrap">
                            <a th:href="@{/solicitudes/confirmar/{id}(id=${s.id})}"
                               class="btn btn-sm btn-success fw-bold"
                               onclick="return confirm('¿Confirmar este turno?')">✅</a>
                            <a th:href="@{/solicitudes/cancelar/{id}(id=${s.id})}"
                               class="btn btn-sm btn-danger fw-bold"
                               onclick="return confirm('¿Cancelar este turno?')">❌</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${solicitudes.isEmpty()}" class="text-center py-5 text-muted">
        <div style="font-size:64px;">📭</div>
        <h4>No hay solicitudes todavía</h4>
    </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
